name: Build SENTINEL APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Zainstaluj zależności
        run: npm install --no-audit --no-fund

      - name: Sprawdź kompletność projektu
        run: npm test

      - name: Utwórz projekt Android
        run: npx cap add android

      - name: Skopiuj aplikację i przygotuj kod natywny
        run: |
          npx cap sync android
          node patch-android.js

      - name: Przygotuj podpis APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/sentinel.keystore
            echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-sentinel}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Użyto stałego klucza z GitHub Secrets."
          else
            keytool -genkeypair -v \
              -keystore android/app/sentinel.keystore \
              -storepass android -keypass android \
              -alias sentinel -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Sentinel Debug, OU=Internal, O=Sentinel, L=Warsaw, C=PL" -noprompt
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=sentinel" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "Utworzono jednorazowy klucz testowy."
          fi

      - name: Zbuduj APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Przygotuj nazwę pliku
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SENTINEL-Karol.apk

      - name: Udostępnij instalator
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-Karol-APK
          path: SENTINEL-Karol.apk
          if-no-files-found: error
          retention-days: 30
